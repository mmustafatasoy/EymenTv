name: Build EYMEN Uydu TV 0.4 APK
on:
  push:
    branches: [build/uydu-0.4-apk]
    paths: ['uydu-packages/eymen-tv-0.4.b64', '.github/workflows/build-uydu-apk.yml']
  pull_request:
    branches: [main]
    paths: ['uydu-packages/eymen-tv-0.4.b64', '.github/workflows/build-uydu-apk.yml']
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API and tools
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-33' 'build-tools;33.0.2'
      - name: Unpack EYMEN TV source archive
        run: |
          base64 -d uydu-packages/eymen-tv-0.4.b64 > /tmp/eymen-tv-04.zip
          unzip -q /tmp/eymen-tv-04.zip
      - name: Test channel navigation
        run: |
          cd eymen-uydu-kontrol
          mkdir -p build/navtests
          javac -d build/navtests src/com/eymen/uydukontrol/PageNav.java tests/PageNavTest.java
          java -cp build/navtests PageNavTest
      - name: Build and verify APK
        run: |
          cd eymen-uydu-kontrol
          export TV_ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          export TV_BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          bash build.sh
      - name: Publish test APK release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view uydu-tv-v0.4-test >/dev/null 2>&1; then
            gh release upload uydu-tv-v0.4-test eymen-uydu-kontrol/build/EYMEN-TV-0.4.apk --clobber
          else
            gh release create uydu-tv-v0.4-test eymen-uydu-kontrol/build/EYMEN-TV-0.4.apk --target "$GITHUB_SHA" --title "EYMEN TV Uydu 0.4 (test APK)" --notes "Whale OS / Android TV test version. 10-item paging, editable channels, custom logos and animated branding. DTVKit audio requires on-device verification." --prerelease --latest=false
          fi
