name: Build EYMEN TV APK

on:
  push:
    branches: [main]
    paths:
      - 'web-parts/**'
      - 'android-launcher/**'
      - '.github/workflows/build.yml'
      - 'EYMEN-TV-WhaleOS-v1.0-KAYNAK-PROJE.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout EymenTv
        uses: actions/checkout@v4

      - name: Reconstruct original EYMEN TV screens and splash animation
        shell: bash
        run: |
          set -euo pipefail
          if test -f web-parts/part-00.txt; then
            cat web-parts/part-*.txt > index.html
          elif test -s EYMEN-TV-WhaleOS-v1.0-KAYNAK-PROJE.zip; then
            mkdir -p /tmp/eymentv
            unzip -q EYMEN-TV-WhaleOS-v1.0-KAYNAK-PROJE.zip -d /tmp/eymentv
            cp -a /tmp/eymentv/EYMEN-TV-WhaleOS/. ./
          fi
          test -s index.html || { echo "::error::EYMEN TV screen source missing"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          must=['id="splash-letters"','id="hotspots"','EYMEN_INLINE_IMAGES','assets/home.png','assets/apps.png','assets/settings.png','window.EYMEN_TV']
          for token in must:
              if token not in page: raise SystemExit('Missing EYMEN TV feature: '+token)
          print('EYMEN TV original image-based UI:',len(page),'characters, passed')
          PY
          if test -f web-parts/part-00.txt; then
            echo "Source stored in 13 Git blobs, reassembled into exact approved art."
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android-compatible TV launcher
        working-directory: android-launcher
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify compiled APK
        run: |
          test -s android-launcher/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-launcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK for TV installation
        uses: actions/upload-artifact@v4
        with:
          name: EymenTv-Android-TV-Launcher-APK
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
