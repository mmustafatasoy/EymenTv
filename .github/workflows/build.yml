name: Build EYMEN Uydu TV — Kanal Listesi

on:
  push:
    branches: [main]
    paths:
      - 'eymen-uydu-kontrol/**'
      - 'uydu-packages/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'eymen-uydu-kontrol/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eymen-uydu-main-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout EYMEN TV channel application
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore channel application source (initial migration only)
        shell: bash
        run: |
          set -euo pipefail
          if test -f uydu-packages/eymen-tv-0.4.b64; then
            base64 -d uydu-packages/eymen-tv-0.4.b64 > /tmp/eymen-tv-04.zip
            unzip -q /tmp/eymen-tv-04.zip
          fi
          test -f eymen-uydu-kontrol/build.sh
          test -f eymen-uydu-kontrol/src/com/eymen/uydukontrol/PageNav.java
          test -f eymen-uydu-kontrol/tests/PageNavTest.java
          echo "Channel project source available; no launcher source present."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-33' 'build-tools;33.0.2'

      - name: Test ten-channel paging and remote navigation
        shell: bash
        run: |
          set -euo pipefail
          cd eymen-uydu-kontrol
          mkdir -p build/navtests
          javac -d build/navtests src/com/eymen/uydukontrol/PageNav.java tests/PageNavTest.java
          java -cp build/navtests PageNavTest

      - name: Render logo-only watermark (no permanent URL) and 8K PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cairosvg pillow
          mkdir -p dist
          python3 - <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path
          src="eymen-uydu-kontrol/assets/brand_right.svg"
          runtime="eymen-uydu-kontrol/assets/brand_right.png"
          master="dist/EYMEN-TV-Logo-8K.png"
          cairosvg.svg2png(url=src,write_to=runtime,output_width=1024,output_height=576)
          cairosvg.svg2png(url=src,write_to=master,output_width=7680,output_height=4320)
          for p,w,h in [(runtime,1024,576),(master,7680,4320)]:
            with Image.open(p) as img:
              img.load()
              assert img.size==(w,h) and img.mode=="RGBA",(p,img.size,img.mode)
            print("Logo image verified:",p,Path(p).stat().st_size)
          PY

      - name: Build EYMEN TV channel APK
        shell: bash
        run: |
          set -euo pipefail
          cd eymen-uydu-kontrol
          export TV_ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          export TV_BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          bash build.sh
          test -s build/EYMEN-TV-0.11.apk
          ls -lh build/EYMEN-TV-0.11.apk

      - name: Commit channel source and remove temporary packed archive
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if test -f uydu-packages/eymen-tv-0.4.b64; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A eymen-uydu-kontrol
            git rm -f uydu-packages/eymen-tv-0.4.b64
            git commit -m "source: move TV channel app into main and remove bootstrap archive [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify cross-TV input filtering and fallback
        run: python3 eymen-uydu-kontrol/tests/cross_tv_smoke_test.py

      - name: Verify bulk channel controls and permanent right EYMEN TV watermark
        run: python3 eymen-uydu-kontrol/tests/brand_bulk_smoke_test.py

      - name: Verify hourly top website badge and removal of lower advertisements
        run: python3 eymen-uydu-kontrol/tests/promo_smoke_test.py

      - name: Publish EYMEN TV v0.11 without advertisement
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp eymen-uydu-kontrol/build/EYMEN-TV-0.11.apk dist/EYMEN-TV-Kanal-Listesi-v0.11.apk
          test -s dist/EYMEN-TV-Kanal-Listesi-v0.11.apk
          cat > /tmp/eymen-release-notes.md <<'NOTES'
          # EYMEN TV — Uydu Kanal Listesi v0.11

          - Yayın altındaki fotoğraflı, telefon numaralı reklam bandı ve tüm eski reklam animasyonları kaldırıldı.
          - Sağ üst EYMEN TV logosu şeffaf arka planda sürekli görünür; önceki dönen marka hareketi korunmuştur.
          - Üstte küçük EYMEN TV ve www.atasoyyazilim.com tanıtımı yalnızca 60 dakikada bir, 15 saniye gösterilir.
          - Son otomatik gösterim SharedPreferences ile saklanır; uygulamayı kapatıp açmak saati sıfırlamaz.
          - Ayarlar > Saatlik logo/web göster (test) seçeneği, saate dokunmadan yalnızca önizleme gösterir.
          - Fotoğraf, telefon, isim, alt bant ve promosyon görselleri yeni APK içinde bulunmaz.
          - 10'lu kanal sayfaları, toplu silme/geri getirme, kanal logoları, kumanda ve ses işlevleri korunur.
          - Android TV / Whale OS / Vestel TV Input Framework izinleri cihaz üreticisine göre değişebilir; donanımda test edilmelidir.
          - Önceki v0.10 GitHub sürümü arşivde kalır; v0.11 yeni sürümdür.

          NOTES
          if ! gh release view uydu-tv-v0.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create uydu-tv-v0.11 dist/EYMEN-TV-Kanal-Listesi-v0.11.apk dist/EYMEN-TV-Logo-8K.png \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EYMEN TV — Uydu Kanal Listesi v0.11 • Reklamsız, Saatlik Üst Marka" \
              --notes-file /tmp/eymen-release-notes.md \
              --latest
          else
            gh release upload uydu-tv-v0.11 dist/EYMEN-TV-Kanal-Listesi-v0.11.apk dist/EYMEN-TV-Logo-8K.png \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release view uydu-tv-v0.11 --repo "$GITHUB_REPOSITORY" --json url,assets

      - name: Remove obsolete launcher release and duplicate channel test release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.0.0-test --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Old launcher release removed."
          fi
          if gh release view uydu-tv-v0.4-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete uydu-tv-v0.4-test --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Duplicate channel test release removed after canonical publication."
          fi

      - name: Remove obsolete integration branch
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/branches/build%2Fuydu-0.4-apk" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/build/uydu-0.4-apk"
            echo "Obsolete integration branch deleted. Only the channel application remains on main."
          fi
