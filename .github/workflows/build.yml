name: EYMEN TV - Whale OS and Android Launcher

on:
  push:
    branches: [main]
    paths:
      - 'EYMEN-TV-WhaleOS-v1.0-KAYNAK-PROJE.zip'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'config.json'
      - 'assets/**'
      - 'android-launcher/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact approved EYMEN TV source ZIP if present
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          ZIP="EYMEN-TV-WhaleOS-v1.0-KAYNAK-PROJE.zip"
          if test -s "$ZIP"; then
            mkdir -p /tmp/eymentv
            unzip -q "$ZIP" -d /tmp/eymentv
            test -f /tmp/eymentv/EYMEN-TV-WhaleOS/index.html
            cp -a /tmp/eymentv/EYMEN-TV-WhaleOS/. ./
          fi
          if test ! -f index.html || test ! -f android-launcher/app/build.gradle.kts; then
            echo "::notice::Kaynak ZIP henüz yüklenmedi. README içindeki tek ZIP yükleme adımını tamamlayın."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in index.html app.js styles.css config.json \
              assets/home.png assets/apps.png assets/settings.png \
              android-launcher/app/src/main/AndroidManifest.xml; do
            test -s "$file" || { echo "::error file=$file::Zorunlu proje dosyası eksik"; exit 1; }
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.prepare.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        if: steps.prepare.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test TV screen assets, animation and navigation
        if: steps.prepare.outputs.ready == 'true'
        run: node tests/check.mjs

      - name: Build Android-compatible HOME launcher APK
        if: steps.prepare.outputs.ready == 'true'
        working-directory: android-launcher
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        if: steps.prepare.outputs.ready == 'true'
        run: test -s android-launcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable Android APK
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EymenTv-Android-TV-Launcher-APK
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
