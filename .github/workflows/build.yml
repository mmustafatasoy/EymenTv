name: Build EYMEN Uydu TV — Kanal Listesi

on:
  push:
    branches: [main]
    paths:
      - 'eymen-uydu-kontrol/**'
      - 'uydu-packages/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'eymen-uydu-kontrol/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eymen-uydu-main-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout EYMEN TV channel application
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore channel application source (initial migration only)
        shell: bash
        run: |
          set -euo pipefail
          if test -f uydu-packages/eymen-tv-0.4.b64; then
            base64 -d uydu-packages/eymen-tv-0.4.b64 > /tmp/eymen-tv-04.zip
            unzip -q /tmp/eymen-tv-04.zip
          fi
          test -f eymen-uydu-kontrol/build.sh
          test -f eymen-uydu-kontrol/src/com/eymen/uydukontrol/PageNav.java
          test -f eymen-uydu-kontrol/tests/PageNavTest.java
          echo "Channel project source available; no launcher source present."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 33
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-33' 'build-tools;33.0.2'

      - name: Test ten-channel paging and remote navigation
        shell: bash
        run: |
          set -euo pipefail
          cd eymen-uydu-kontrol
          mkdir -p build/navtests
          javac -d build/navtests src/com/eymen/uydukontrol/PageNav.java tests/PageNavTest.java
          java -cp build/navtests PageNavTest

      - name: Render transparent TV logo and 8K PNG directly from vector source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cairosvg pillow
          mkdir -p dist
          python3 - <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path
          src="eymen-uydu-kontrol/assets/brand_3d.svg"
          runtime="eymen-uydu-kontrol/assets/brand_3d.png"
          master="dist/EYMEN-TV-Logo-8K.png"
          cairosvg.svg2png(url=src,write_to=runtime,output_width=1024,output_height=576)
          cairosvg.svg2png(url=src,write_to=master,output_width=7680,output_height=4320)
          for p,w,h in [(runtime,1024,576),(master,7680,4320)]:
            with Image.open(p) as img:
              img.load()
              assert img.size==(w,h) and img.mode=="RGBA",(p,img.size,img.mode)
            print("Logo image verified:",p,Path(p).stat().st_size)
          PY

      - name: Build EYMEN TV channel APK
        shell: bash
        run: |
          set -euo pipefail
          cd eymen-uydu-kontrol
          export TV_ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          export TV_BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          bash build.sh
          test -s build/EYMEN-TV-0.11.apk
          ls -lh build/EYMEN-TV-0.11.apk

      - name: Commit channel source and remove temporary packed archive
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if test -f uydu-packages/eymen-tv-0.4.b64; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A eymen-uydu-kontrol
            git rm -f uydu-packages/eymen-tv-0.4.b64
            git commit -m "source: move TV channel app into main and remove bootstrap archive [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify cross-TV input filtering and fallback
        run: python3 eymen-uydu-kontrol/tests/cross_tv_smoke_test.py

      - name: Test channel bulk actions and hourly rotating logo
        run: python3 eymen-uydu-kontrol/tests/brand_bulk_smoke_test.py

      - name: Verify no advertisement and hourly top-right logo plus website
        run: python3 eymen-uydu-kontrol/tests/promo_smoke_test.py

      - name: Publish EYMEN TV v0.11 without advertising banner
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp eymen-uydu-kontrol/build/EYMEN-TV-0.11.apk dist/EYMEN-TV-Kanal-Listesi-v0.11.apk
          test -s dist/EYMEN-TV-Kanal-Listesi-v0.11.apk
          cat > /tmp/eymen-release-notes.md <<'NOTES'
          # EYMEN TV — Uydu Kanal Listesi v0.11

          - **Tam ekran genişliğindeki alt bant reklam ve fotoğraf/telefon/isim promosyonu kaldırıldı.**
          - Sağ üstteki şeffaf 3D EYMEN TV logosu ve atasoyyazilim.com adresi korunur.
          - Bu küçük köşe markası yalnızca **her 60 dakikada bir, 15 saniye** görünür; sürekli açık değildir.
          - Son otomatik gösterim zamanı TV'de saklanır; uygulama yeniden açıldığında sıklık sıfırlanmaz.
          - MENU → Uygulama ayarları → Görünüm, ses ve diğer ayarlar → **Sağ üst logo ve web adresini göster (test)** ile önizleme yapılabilir.
          - 10 kanallık sayfalar, kumanda gezinmesi, kanal ses izinleri, toplu seçerek silme, geri getirme ve kanal logoları değiştirilmedi.
          - Kaynak kod ve TV ekranındaki geniş reklam görselleri APK paketinden çıkarıldı.
          - Eski v0.10 ve önceki sürümler GitHub Releases içinde ayrı korunur.

          **Bu APK yalnızca Android uyumlu TV'lerde test sürümüdür.** DTVKit, Vestel ve Whale TV üzerinde kanal oynatma ve ses izni cihaz üreticisi tarafından sınırlandırılabilir. Eski kurulumla imza uyuşmazsa yükleme/güncelleme başarısız olabilir.
          NOTES
          if ! gh release view uydu-tv-v0.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create uydu-tv-v0.11 dist/EYMEN-TV-Kanal-Listesi-v0.11.apk dist/EYMEN-TV-Logo-8K.png \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EYMEN TV — v0.11 • Reklamsız, Saatlik Köşe Logosu" \
              --notes-file /tmp/eymen-release-notes.md \
              --latest
          else
            gh release upload uydu-tv-v0.11 dist/EYMEN-TV-Kanal-Listesi-v0.11.apk dist/EYMEN-TV-Logo-8K.png \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release view uydu-tv-v0.11 --repo "$GITHUB_REPOSITORY" --json url,assets
          gh release view uydu-tv-v0.11 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "EYMEN-TV-Kanal-Listesi-v0.11.apk" and .size > 0) | .name' | grep -Fx 'EYMEN-TV-Kanal-Listesi-v0.11.apk'

