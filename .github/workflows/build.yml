name: EYMEN TV 2.0 — Derle, imzala, yayınla

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eymen-tv-2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Yazı tiplerini indir (Sora, Manrope)
        shell: bash
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/Sora.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/sora/Sora%5Bwght%5D.ttf" || echo "Sora indirilemedi, sistem yazı tipi kullanılacak"
          curl -fsSL -o app/src/main/assets/fonts/Manrope.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf" || echo "Manrope indirilemedi, sistem yazı tipi kullanılacak"
          curl -fsSL -o app/src/main/assets/fonts/GreatVibes.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/greatvibes/GreatVibes-Regular.ttf" || echo "İmza yazı tipi indirilemedi, sistem el yazısı kullanılacak"
          ls -la app/src/main/assets/fonts

      - name: Hazır kanal listesini APK'ya koy
        shell: bash
        run: |
          mkdir -p app/src/main/assets/channels
          if test -s channels/tr.m3u; then cp channels/tr.m3u app/src/main/assets/channels/tr.m3u; fi
          ls -la app/src/main/assets/channels

      - name: İmzalı APK derle
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          test -s app/build/outputs/apk/release/app-release.apk

      - name: GitHub Releases'a yayınla
        id: release
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName *= *"' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          TAG="eymen-tv-v$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/EYMEN-TV-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/EYMEN-TV.apk
          cat > notes.md <<NOTES
          # EYMEN TV $VERSION

          v0.12 ve sonrası sürümlerin üzerine güncelleme olarak kurulur; gizlenen kanallar, favoriler, kanal adları ve özel logolar korunur.

          **2.4 ile gelenler**
          - Radyo kanallarında ekran artık boş kalmıyor: hareketli atasoyyazilim.com tanıtımı
          - Dört sahne döner: logo ve imza, hizmetler, "bizi nasıl bulursunuz", düşen harflerle site adı ve QR kod
          - Telefonla okutulan QR ile doğrudan siteye gidiş; altta müzikle oynayan ses dalgası

          **2.3 ile gelenler**
          - Taşınan kanalın numarası artık sırasına göre değişir, numara yazarak da taşınır
          - Kanal silme ve Silinen kanallar bölümünden geri getirme
          - Kanala kendi logonu ekleme: telefondan, hazır listeden ya da USB'den

          **2.2 ile gelenler**
          - EYMEN Başlatıcı ana ekranında son izlenen kanal ve kanal listesi

          **2.1 ile gelenler**
          - Hazır internet kanal listesi: Türkiye'nin herkese açık ücretsiz yayınları, her gün GitHub'da denenir
          - Bu TV'de açılmayan internet kanalları otomatik gizlenir (Ayarlar › Kanal kaynakları)
          - EYMEN Başlatıcı'dan doğrudan kanal ve ekran açma

          **2.0'dan beri**
          - Açılışta EYMEN TV logosu ve M. Muhammet Atasoy imzası
          - Kanal bandı, kanal rehberi, yayın akışı ve hatırlatıcılar
          - Ana ekran, ayarlar ve kanal yönetimi (sırala, gizle, ad, logo, kategori, PIN kilidi)
          - Uydu sinyali kesilince internet yayınına otomatik geçiş
          - QR ile telefon kumandası, uygulama içinden güncelleme

          TV'ye kurmak için Downloader uygulamasına şu adresi yazın:
          https://github.com/mmustafatasoy/EymenTv/releases/latest/download/EYMEN-TV.apk
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/EYMEN-TV-$VERSION.apk" dist/EYMEN-TV.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest
          else
            gh release create "$TAG" "dist/EYMEN-TV-$VERSION.apk" dist/EYMEN-TV.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EYMEN TV $VERSION" \
              --notes-file notes.md \
              --latest
          fi

      - name: Sonucu ci-logs dalına yaz
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
        run: |
          mkdir -p /tmp/ci
          touch build.log
          {
            echo "sha=$GITHUB_SHA"
            echo "build=$BUILD_RESULT"
            echo "release=$RELEASE_RESULT"
            echo "run=$GITHUB_RUN_ID"
            echo "---- errors"
            grep -E "^e: |error:|What went wrong|Could not|FAILED" -A4 build.log | head -400 || true
            echo "---- tail"
            tail -150 build.log
          } > /tmp/ci/latest.txt
          cp build.log /tmp/ci/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null
          mkdir -p logs
          cp /tmp/ci/latest.txt logs/latest.txt
          cp /tmp/ci/build.log logs/build.log
          git add -f logs/latest.txt logs/build.log
          git commit -m "ci: build=$BUILD_RESULT release=$RELEASE_RESULT $GITHUB_SHA [skip ci]"
          git push -f origin HEAD:ci-logs
